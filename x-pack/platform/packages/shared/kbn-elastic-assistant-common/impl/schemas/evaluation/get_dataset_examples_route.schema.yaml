openapi: 3.0.0
info:
  title: Get Dataset Examples API endpoint
  version: "1"
paths:
  /internal/elastic_assistant/evaluate/dataset/{datasetName}/examples:
    get:
      x-codegen-enabled: true
      x-labels: [ess, serverless]
      operationId: GetDatasetExamples
      description: Get examples from a specific LangSmith dataset
      summary: Get examples from a specific dataset
      tags:
        - Evaluation API
      parameters:
        - name: datasetName
          in: path
          required: true
          description: The name of the dataset to fetch examples from
          schema:
            type: string
        - name: 'limit'
          in: query
          required: false
          description: Maximum number of examples to return
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: 'langSmithApiKey'
          in: query
          required: false
          description: Optional LangSmith API key to override environment variables
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetName:
                    type: string
                  examples:
                    type: array
                    items:
                      type: object
                      properties:
                        created_at:
                          type: string
                        id:
                          type: string
                        inputs:
                          type: object
                          additionalProperties: true
                        metadata:
                          type: object
                          additionalProperties: true
                        modified_at:
                          type: string
                        name:
                          type: string
                        outputs:
                          type: object
                          additionalProperties: true
                      required:
                        - created_at
                        - id
                        - inputs
                required:
                  - datasetName
                  - examples
        "400":
          description: Generic Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  message:
                    type: string

